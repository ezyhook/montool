# montool configuration — copy to /etc/telegram-auth.conf and fill in.
# Only BOT_TOKEN and CHAT_ID are required; everything else has sane defaults.
# install.sh can generate this file for you on first run.

# ── Required ──────────────────────────────────────────────────────────────────
BOT_TOKEN=123456789:AA-your-bot-token-here
CHAT_ID=-1001234567890

# Optional forum topic id (supergroups with topics enabled)
THREAD_ID=

# ── Host identity (shown in messages) ─────────────────────────────────────────
lable=my-server
ip4=

# ── Role ──────────────────────────────────────────────────────────────────────
# 1 = leader (Telegram long-polling), 0 = agent (HTTP server)
ENABLE_POLLING=1
SEND_WELCOME=0
LEADER_THREAD_ID=

# Agent routing map: { "thread_id": "http://agent-host:9797" }
DISPATCH_MAP={}

# Shared secret between leader and agents (change this!)
AGENT_SECRET=change-me
# Bind only to a private interface in production, e.g. 127.0.0.1:9797
AGENT_BIND=0.0.0.0:9797

# ── Traffic interface (empty = autodetect) ────────────────────────────────────
NET_IFACE=

# ── DDoS detector ─────────────────────────────────────────────────────────────
DDOS_ENABLED=1
DDOS_IFACE=
DDOS_INTERVAL=5
DDOS_PPS=100000
DDOS_BPS=104857600
DDOS_CT=0.80
DDOS_TOPN=1000
DDOS_SYN=500
DDOS_COOLDOWN=60

# ── Alerts ────────────────────────────────────────────────────────────────────
ALERT_CPU=1
ALERT_DISK=1
ALERT_SWAP=1
ALERT_RAM=1

# Alert thresholds in percent (empty = built-in defaults: CPU/DISK 99, RAM/SWAP 98)
CPU_LIMIT=
DISK_LIMIT=
RAM_LIMIT=
SWAP_LIMIT=

# ── Agent healthcheck (leader only) ───────────────────────────────────────────
HEALTH_INTERVAL_SEC=30
DOWN_ALERT_REPEAT_MIN=0
HEALTH_TIMEOUT=5
